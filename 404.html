<style>
  :root{--cream:#F0EBE0;--path:#DE4F2B;--ink:#2A2E2B;--paper:#FFFFFF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;text-align:center;padding:24px;overflow:hidden;position:relative}
  .ribbon{position:fixed;left:-22vw;top:-40vh;width:44vw;height:180vh;background:var(--path);border-radius:999px;transform:rotate(24deg);opacity:.92}
  .ribbon2{position:fixed;left:-18vw;top:-40vh;width:44vw;height:180vh;background:#F0A184;border-radius:999px;transform:rotate(24deg);opacity:.5}
  .card{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:44px 48px;box-shadow:6px 6px 0 rgba(42,46,43,.12);max-width:430px}
  .mk{height:44px;width:auto;display:block;margin:0 auto 14px;overflow:visible}
  .mk .mk-face{fill:var(--path)}
  .mk .mk-spark{stroke:#FFC02E}
  .code{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--path)}
  h1{font-size:30px;font-weight:800;letter-spacing:-0.02em;margin:8px 0 10px}
  p{font-size:15px;opacity:.75;line-height:1.55}
  a.btn{display:inline-block;margin-top:22px;background:var(--path);color:#fff;text-decoration:none;font-weight:800;font-size:15px;padding:13px 26px;border-radius:999px}
